<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Font Awesome (diperlukan untuk icon "fa" pada Awesome Markers) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet Awesome Markers CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/" target="_blank"><i
                                class="bi bi-link-45deg"></i> SV UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th>Nama</th>
                            <td>Windi Nur Alfiana</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/556590/SV/25968</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>PGWEB A</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Feature / Jumlah Penduduk -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle">Detail Informasi</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Awesome Markers JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3269522, 123.0156120], 11);

        // Map Panes
        map.createPane('jalan');
        map.getPane('jalan').style.zIndex = 400;

        map.createPane('jumlah_penduduk');
        map.getPane('jumlah_penduduk').style.zIndex = 300;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi Menggunakan Leaflet.awesome-markers
        var toponimi = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                var unsur = (feature.properties.NAMA_UNSUR || "").toString().toLowerCase();
                var iconName = "location-dot";
                var markerColor = "purple";

                if (unsur.includes("gunung")) {
                    iconName = "mountain";
                    markerColor = "red";
                } else if (unsur.includes("tanjung")) {
                    iconName = "water";
                    markerColor = "orange";
                } else if (unsur.includes("teluk")) {
                    iconName = "anchor";
                    markerColor = "cadetblue";
                } else {
                    iconName = "house";
                    markerColor = "purple";
                }

                return L.marker(latlng, {
                    icon: L.AwesomeMarkers.icon({
                        icon: iconName,
                        prefix: "fa",
                        markerColor: markerColor,
                        iconColor: "white"
                    })
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // Variable popup content
                var popup_content = "Nama: " + (feature.properties.TOPONIMI || feature.properties.NAMA_UNSUR) + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " +
                    feature.geometry.coordinates[0] + "<br>" +
                    (feature.properties.image ? "<img src='images/" + feature.properties.image + "' alt='' width='200'/>" : "");

                layer.on({
                    click: function (e) {
                        layer.bindPopup(popup_content).openPopup();
                    },

                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.TOPONIMI || feature.properties.NAMA_UNSUR, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: 'jalan',
            // Style Dinamis Berdasarkan NAMA_UNSUR
            style: function (feature) {
                var namaUnsur = feature.properties.NAMA_UNSUR ? feature.properties.NAMA_UNSUR.toLowerCase() : "";

                // Jalan Propinsi (Merah, Tebal 3, Garis Solid)
                if (namaUnsur.includes("provinsi") || namaUnsur.includes("propinsi")) {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 3
                    };
                }
                // Jalan Kabupaten (Merah, Tebal 1.5, Putus-putus Panjang)
                else if (namaUnsur.includes("kabupaten")) {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 1.5,
                        dashArray: '10, 8'
                    };
                }
                // Jalan Lain (Merah, Tebal 1, Putus-putus Pendek)
                else {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 1,
                        dashArray: '2, 3'
                    };
                }
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // Variable popup content
                var popup_content = "NAMA_UNSUR: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        layer.bindPopup(popup_content).openPopup();
                    },

                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'jumlah_penduduk',
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // Variable popup content
                var popup_content = "<table class='table table-striped table-bordered mb-0'>" +
                    "<tr>" +
                    "<th><i class='bi bi-geo-alt me-2 text-primary'></i>Kecamatan</th>" +
                    "<td>" + feature.properties.WADMKC + "</td>" +
                    "</tr>" +
                    "<tr>" +
                    "<th><i class='bi bi-people me-2 text-success'></i>Jumlah Penduduk</th>" +
                    "<td>" + feature.properties.Penduduk + " Jiwa</td>" +
                    "</tr>" +
                    "<tr>" +
                    "<th><i class='bi bi-bounding-box-circles me-2 text-warning'></i>Luas Wilayah</th>" +
                    "<td>" + feature.properties.luas_km2 + " km&sup2;</td>" +
                    "</tr>" +
                    "</table>";

                layer.on({
                    click: function (e) {
                        $("#featureModalTitle").html("<i class='bi bi-geo-alt-fill text-danger me-2'></i>Kecamatan " + feature.properties.WADMKC);
                        $("#featureModalBody").html(popup_content);
                        $("#featureModal").modal("show");
                    },
                    mouseover: function (e) {
                        layer.bindTooltip("Jumlah Penduduk: " + feature.properties.Penduduk, {
                            sticky: true
                        }).openTooltip();
                    },
                });
            },
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var label_toponimi = "Toponimi<br>" +
            "<span style='display: block; margin-left: 20px; font-size: 12px; line-height: 1.5; margin-top: 2px;'>" +
            "<i class='fa-solid fa-mountain' style='color: red; margin-right: 4px;'></i> Gunung<br>" +
            "<i class='fa-solid fa-water' style='color: orange; margin-right: 4px;'></i> Tanjung<br>" +
            "<i class='fa-solid fa-anchor' style='color: cadetblue; margin-right: 4px;'></i> Teluk<br>" +
            "<i class='fa-solid fa-house' style='color: purple; margin-right: 4px;'></i> Permukiman/Lainnya" +
            "</span>";

        var label_jalan = "Jalan<br>" +
            "<span style='display: block; margin-left: 20px; font-size: 12px; line-height: 1.5; margin-top: 2px;'>" +
            "<i style='border-top: 3px solid red; width: 16px; display: inline-block; vertical-align: middle; margin-right: 4px;'></i> Jalan Propinsi<br>" +
            "<i style='border-top: 1.5px dashed red; width: 16px; display: inline-block; vertical-align: middle; margin-right: 4px;'></i> Jalan Kabupaten<br>" +
            "<i style='border-top: 0.5px dotted red; width: 16px; display: inline-block; vertical-align: middle; margin-right: 4px;'></i> Jalan Lain" +
            "</span>";

        var label_jumlah_penduduk = "Jumlah Penduduk<br>" +
            "<span style='display: block; margin-left: 20px; font-size: 12px; line-height: 1.5; margin-top: 2px;'>" +
            "<i style='background: #ffffb2; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></i> &le; 12.000<br>" +
            "<i style='background: #fd8d3c; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></i> 12.001 - 24.000<br>" +
            "<i style='background: #bd0026; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></i> &gt; 24.000" +
            "</span>";

        var overlayMaps = {};
        overlayMaps[label_toponimi] = toponimi;
        overlayMaps[label_jalan] = jalan;
        overlayMaps[label_jumlah_penduduk] = jumlah_penduduk;

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            metric: true,
            imperial: false
        }).addTo(map);
    </script>
</body>

</html>
